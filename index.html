<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/all.min.css" />
    <script src="js/script.js" defer></script>
    <title>Modern Login Page</title>
  </head>
  <body>
    <section class="container">
      <div class="container-signIn">
        <div class="parent-title">
          <h1>sign in</h1>
        </div>
        <div class="mediaAddAccounts">
          <span><i class="fa-brands fa-google"></i></span>
          <span><i class="fa-brands fa-facebook"></i></span>
          <span><i class="fa-brands fa-linkedin"></i></span>
          <span><i class="fa-brands fa-apple"></i></span>
        </div>
        <div class="note">
          <p>or use your email & password</p>
        </div>
        <form>
          <input type="email" name="" id="" placeholder="email" />
          <input type="password" name="" id="" placeholder="password" />
          <button id="ForgetPasswordBtn">forgit your password?</button>
          <button id="signIn-btn">sign in</button>
        </form>
      </div>
      <div class="container-signUp">
        <div class="parent-title">
          <h1>sign up</h1>
        </div>
        <div class="mediaAddAccounts">
          <span><i class="fa-brands fa-google"></i></span>
          <span><i class="fa-brands fa-facebook"></i></span>
          <span><i class="fa-brands fa-linkedin"></i></span>
          <span><i class="fa-brands fa-apple"></i></span>
        </div>
        <div class="note">
          <p>or use your email & password</p>
        </div>
        <form>
          <input type="text" name="" id="" placeholder="user name"/>
          <input type="email" name="" id="" placeholder="email"/>
          <input type="password" name="" id="" placeholder="password"/>
          <button id="signUp-btn">sign up</button>
        </form>
      </div>
      <section class="toggle-container">
        <div class="toggle">
          <div class="toggle-panal-right">
            <div class="title">
              <h1>hello, friend</h1>
            </div>
            <div class="paragraph">
              <p>Register with your personal details to use all of site features</p>
            </div>
            <button id="togleSignUpBtn">sign up</button>
          </div>
          <div class="toggle-panal-left">
            <div class="title">
              <h1>Welcome Back👋</h1>
            </div>
            <div class="paragraph">
              <p>Enter your personal details to use all of site features</p>
            </div>
            <button id="toggleSignInBtn">sign in</button>
          </div>
        </div>
      </section>
    </section>
  </body>
</html>
